submission:
  title: "GridSentry"                  # REQUIRED

  problem_statement: >                 # REQUIRED
    Utility grid operators rely on fixed-calendar maintenance schedules instead of real-time
    equipment condition data. Sensor readings that could predict transformer and substation
    failures weeks in advance are ignored, and live weather forecasts are never combined with
    them — leading to surprise blackouts that cost utilities over $1M per hour.

  solution_summary: >                  # REQUIRED
    GridSentry is a browser-based grid advisor that monitors a fleet of 35 simulated grid
    assets (transformers, substations, feeders) using synthetic sensor time-series data,
    live weather forecasts from Open-Meteo, and historical incident records. It computes a
    composite 0-100 Risk Score per asset, ranks them by risk and grid-impact severity,
    generates plain-English explanations of why each asset is risky, and produces a
    prioritised maintenance plan operators can act on today — all client-side, with no backend.

  key_features:
    - "Real-time composite Risk Score (0-100) combining sensor health, weather risk, and incident history"
    - "Interactive dark-theme risk map with colour-coded asset markers by risk tier"
    - "Ranked asset list with sortable risk cards and plain-English explanations"
    - "Sensor trend charts (temperature, load, vibration, oil quality) with 24-point history"
    - "Prioritised maintenance plan with recommended action, timeframe, and estimated cost"

  tech_stack:
    languages: ["TypeScript", "CSS"]
    frameworks: ["React 18", "Vite", "Tailwind CSS", "Recharts", "React-Leaflet", "Zustand"]
    ibm_technologies: ["IBM Bob AI"]
    databases: []
    other: ["Open-Meteo API (free, keyless)", "Vitest", "ESLint", "OpenStreetMap tiles (keyless)"]

  what_we_are_most_proud_of: >
    The deterministic risk scoring engine — a weighted composite formula that combines live
    weather data, synthetic sensor telemetry, and historical incident weight into a single
    actionable 0-100 score, with automatic plain-English explanations identifying the top
    contributing risk factor per asset. This runs entirely in the browser, with no backend.

  known_limitations: >
    Sensor data is synthetically generated (not real SCADA feeds). The weather integration
    uses the free Open-Meteo API which may be rate-limited; a mock fallback is provided.
    The app is not yet deployed to a public URL — run locally with npm install && npm run dev.
    Demo video link and live URL are placeholders pending recording and optional deployment.

